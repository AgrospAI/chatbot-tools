resources:
  store:
    strategy: milvus
    params:
      host: milvus.agrospai.udl.cat
      port: 19530
      collection_name: TW9d9O3pDqgh4qLBs0iEAud
      # vs4GRJPi4VeWa7cDRzb2Rm4
      # kU3ujmaApEduQc_P4xcOrxL
      user: ${MILVUS_USER}
      password: ${MILVUS_PASSWORD}
      dimension: 4096
  llm:
    strategy: openai
    params:
      api_key: ${CHAT_API_KEY}
      base_url: https://chat.agrospai.udl.cat/api
      model_name: gpt-oss:latest
      temperature: 0.0
  sources:
    steps:
      fetching:
        # - strategy: Path
        #   params:
        #     path: ./resources/test/
        # - strategy: SitemapXML
        #   params:
        #     url: https://agrospai.udl.cat/sitemap.xml
        #     regex:
        #       - https?://[^/]+/docs/
        - strategy: Crawling
          params:
            url: https://agrospai.udl.cat
            workers: 5
            depth: 2
            delay: 0
      parsing:
        - strategy: HtmlParser
          params:
            use:
              - SitemapXML
              - Crawling
        # - strategy: FileParser
        #   params:
        #     use:
        #       - Path
experiments:
  strategy: async_experiments
  params:
    max_concurrent: 5
  steps:
    chunking:
      - strategy: ParentChild
        params:
          model_name: qwen3-embedding:8b
          url: https://chat.agrospai.udl.cat/ollama/api/embed
          api_key: ${CHAT_API_KEY}
      # - strategy: SlidingWindow
      #   params:
      #     chunk_size: 1200
      #     chunk_overlap: 200
    embedding:
      - strategy: OpenAI-Simple
        params:
          model: qwen3-embedding:8b
          api_key: ${CHAT_API_KEY}
          url: https://chat.agrospai.udl.cat/ollama/api/embed
    benchmarking:
      - strategy: QuerySet
        params:
          questions:
            - [
                "Who is the staff of the agrospai project?",
                "Roberto Garcia Gonzalez",
              ]
            - [
                "What technologies does AgrospAI use to make payments",
                "Smart Contracts",
                "Blockchain",
              ]
            - [
                "What credentials should we prepared for the incorporation in agrospai?",
                "Credentials",
            ]
            - [
                "How can we automatize the signature?",
                "Wallet",
            ]
            - [
                "Whats Kit espacios de datos?",
            ]
            - [
                "How to publish an asset in agrospai?",
            ]    
            - [
                "Who is the head investigator from agrospai?",
            ]
            - [
                "Whats the use case Validation of computer vision models applied to crops?",
            ]
      - strategy: ChunkQuality
