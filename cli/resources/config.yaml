resources:
  store:
    strategy: milvus
    params:
      host: milvus.agrospai.udl.cat
      port: 19530
      collection_name: AvMo7ynSplh8uirEIb_fZ1M
      user: ${MILVUS_USER}
      password: ${MILVUS_PASSWORD}
  llm:
    strategy: openai
    params:
      api_key: ${CHAT_API_KEY}
      base_url: https://chat.agrospai.udl.cat/api
      model_name: gpt-oss:latest
      temperature: 0.0
  sources:
    steps:
      fetching:
        # - strategy: Path
        #   params:
        #     path: ./resources/test/

        # - strategy: SitemapXML
        #   params:
        #     url: https://agrospai.udl.cat/sitemap.xml
        #     regex:
        #       - https?://[^/]+/docs/
        - strategy: URL
          params:
            url: https://agrospai.udl.cat/en/contact-us/

        # - strategy: Crawling
        #   params:
        #     url: https://agrospai.udl.cat
        #     workers: 5
        #     depth: 5
        #     delay: 0
      parsing:
        - strategy: HtmlParser
          params:
            use:
              - SitemapXML
              - Crawling
              - URL
        # - strategy: FileParser
        #   params:
        #     use:
        #       - Path
experiments:
  strategy: async_experiments
  params:
    max_concurrent: 5
  steps:
    chunking:
      - strategy: ParentChild
        params:
          model_name: paraphrase-multilingual:latest
          url: https://chat.agrospai.udl.cat/ollama/api/embed
          api_key: ${CHAT_API_KEY}
      # - strategy: SlidingWindow
      #   params:
      #     chunk_size: 1200
      #     chunk_overlap: 200
    embedding:
      - strategy: OpenAI-Simple
        params:
          model: qwen3-embedding:8b
          #model: nomic-embed-text:latest
          api_key: ${CHAT_API_KEY}
          url: https://chat.agrospai.udl.cat/ollama/api/embed
          batch_size: 4
    benchmarking:
      - strategy: QuerySet
        params:
          questions:
            - [
                "Who is the staff of the agrospai project?",
                "Roberto Garcia Gonzalez",
              ]
            - [
                "What technologies does AgrospAI use to make payments",
                "Smart Contracts",
                "Blockchain",
              ]
      - strategy: ChunkQuality
